project:
  type: book
  output-dir: _book
  resources:
    - assets/**
    - cases/**
    - quizzes/**
    - diagrams/**
    - decks/**
    - figures/**

book:
  title: "Microbes in Medicine"
  subtitle: "Foundations of microbiology — an interactive companion"
  author: "NUS Medicine (draft — author line to be confirmed)"
  search: true
  chapters:
    - index.qmd
    - part: chapters/foundations/index.qmd
      chapters:
        - chapters/foundations/microbial-world.qmd
        - chapters/foundations/host-microbe.qmd
        - chapters/foundations/transmission-outbreaks.qmd
        - chapters/foundations/detection-control.qmd
    - part: chapters/bacteria/index.qmd
      chapters:
        - chapters/bacteria/bacteria-build-energy.qmd
        - chapters/bacteria/bacterial-genetics.qmd
        - chapters/bacteria/bacterial-damage.qmd
        - chapters/bacteria/detecting-bacteria.qmd
        - chapters/bacteria/bacteria-map.qmd
        - chapters/bacteria/gram-positive-cocci.qmd
        - chapters/bacteria/gram-positive-rods.qmd
        - chapters/bacteria/enterobacterales.qmd
        - chapters/bacteria/environmental-gram-negatives.qmd
        - chapters/bacteria/fastidious-gram-negatives.qmd
        - chapters/bacteria/anaerobes.qmd
        - chapters/bacteria/spiral-bacteria.qmd
        - chapters/bacteria/atypicals-mycobacteria.qmd
    - part: chapters/viruses/index.qmd
      chapters:
        - chapters/viruses/virus-structure-replication.qmd
        - chapters/viruses/virus-change.qmd
        - chapters/viruses/virus-host.qmd
        - chapters/viruses/detecting-viruses.qmd
        - chapters/viruses/virus-map.qmd
        - chapters/viruses/respiratory-viruses.qmd
        - chapters/viruses/enteric-viruses.qmd
        - chapters/viruses/bloodborne-viruses.qmd
        - chapters/viruses/arboviruses.qmd
        - chapters/viruses/herpesviruses.qmd
    - part: chapters/fungi/index.qmd
      chapters:
        - chapters/fungi/fungal-principles.qmd
        - chapters/fungi/fungal-groups.qmd
    - part: chapters/parasites/index.qmd
      chapters:
        - chapters/parasites/life-cycles.qmd
        - chapters/parasites/protozoa.qmd
        - chapters/parasites/helminths.qmd
    - part: "Across the worlds"
      chapters:
        - chapters/across/comparing-worlds.qmd
  appendices:
    - glossary.qmd
    - teaching-notes.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    number-sections: true
    html-math-method: katex
    lightbox: true
    # Components bundle (built by /components via Vite into book/assets/).
    # Loaded site-wide so interactive islands hydrate on every page.
    include-in-header:
      text: |
        <link rel="stylesheet" href="/assets/components.css">
        <style>
          /* Wide Markdown tables scroll inside their own box on phones instead of widening the page. */
          @media (max-width: 640px) { main table.table { display: block; overflow-x: auto; } }
          /* Long DOI links in reference lists wrap instead of widening the page. */
          main a { overflow-wrap: anywhere; }
        </style>
    include-after-body:
      text: |
        <script type="module" src="/assets/components.js"></script>
