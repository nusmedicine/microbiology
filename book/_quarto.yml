project:
  type: book
  output-dir: _book
  resources:
    - assets/**
    - cases/**
    - quizzes/**
    - diagrams/**
    - decks/**
    - figures/**

book:
  title: "Microbes in Medicine"
  subtitle: "Foundations of microbiology — an interactive companion"
  author: "NUS Medicine (draft — author line to be confirmed)"
  search: true
  chapters:
    - index.qmd
    - part: "I · Principles"
      chapters:
        - chapters/principles/microbial-world.qmd
        - chapters/principles/bacteria-build-energy.qmd
        - chapters/principles/bacterial-genetics.qmd
        - chapters/principles/host-microbe.qmd
        - chapters/principles/transmission-outbreaks.qmd
        - chapters/principles/detection-control.qmd
    - part: "II · Meeting the microbes"
      chapters:
        - chapters/microbes/bacteria-map.qmd
        - chapters/microbes/gram-positive-cocci.qmd
        - chapters/microbes/gram-positive-rods.qmd
        - chapters/microbes/enterobacterales.qmd
        - chapters/microbes/environmental-gram-negatives.qmd
        - chapters/microbes/fastidious-gram-negatives.qmd
        - chapters/microbes/anaerobes.qmd
        - chapters/microbes/spiral-bacteria.qmd
        - chapters/microbes/atypicals-mycobacteria.qmd
        - chapters/microbes/viruses.qmd
        - chapters/microbes/fungi.qmd
        - chapters/microbes/parasites.qmd
  appendices:
    - glossary.qmd
    - teaching-notes.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    number-sections: true
    html-math-method: katex
    lightbox: true
    # Components bundle (built by /components via Vite into book/assets/).
    # Loaded site-wide so interactive islands hydrate on every page.
    include-in-header:
      text: |
        <link rel="stylesheet" href="/assets/components.css">
        <style>
          /* Wide Markdown tables scroll inside their own box on phones instead of widening the page. */
          @media (max-width: 640px) { main table.table { display: block; overflow-x: auto; } }
          /* Long DOI links in reference lists wrap instead of widening the page. */
          main a { overflow-wrap: anywhere; }
        </style>
    include-after-body:
      text: |
        <script type="module" src="/assets/components.js"></script>
