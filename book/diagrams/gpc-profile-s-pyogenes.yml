id: gpc-profile-s-pyogenes
name: "Streptococcus pyogenes"
group: "Gram-positive coccus in chains · beta-haemolytic · Lancefield group A"
intro: "Predict three of the five slots. The key idea is that this organism's enzymes help it spread, and that some of its damage comes later, from the host."

slots:
  - slot: identity
    predict:
      stem: "It clears red cells completely around its colonies on blood agar (beta-haemolysis). What does that tell you?"
      options:
        - text: "It makes toxins that burst host cells"
          correct: true
          feedback: "The streptolysins that clear blood agar also damage host cells in tissue. The plate is showing you a weapon."
        - text: "It needs oxygen from red cells to grow"
          correct: false
          feedback: "Streptococci only ferment, so they gain nothing from oxygen. The clearing comes from toxins that lyse red cells."
        - text: "It cannot grow near red cells"
          correct: false
          feedback: "It grows well on blood agar. The clear zone is red cells burst by its toxins."
    entry: "Gram-positive coccus in chains; catalase-negative; ferments only. Beta-haemolytic because of streptolysins. Its surface **M protein** resists phagocytosis and comes in many types."
  - slot: lifestyle
    entry: "Lives on the throat and skin of humans only. Spreads in respiratory particles and by close contact."
  - slot: harm
    predict:
      stem: "It releases enzymes that dissolve clots, DNA and the gel between cells. What does that allow?"
      options:
        - text: "Spreading rapidly through tissue"
          correct: true
          feedback: "Where *S. aureus* builds a fibrin wall, *S. pyogenes* dissolves barriers. Its infections tend to spread rather than form abscesses."
        - text: "Forming a walled-off abscess"
          correct: false
          feedback: "Walling off is the *S. aureus* pattern, helped by coagulase. Enzymes that dissolve clots and tissue gel let *S. pyogenes* spread."
        - text: "Surviving for years inside macrophages"
          correct: false
          feedback: "That is the mycobacterial pattern. These enzymes let *S. pyogenes* spread through tissue."
    entry: "Three patterns: spread through tissue, helped by enzymes that dissolve clots and connective-tissue gel; toxins, including superantigens like those of *S. aureus*; and immune-mediated damage weeks later, after the infection has gone."
  - slot: consequence
    predict:
      stem: "Weeks after a sore throat has cleared, some people develop inflammation of the heart. What is the most likely mechanism?"
      options:
        - text: "Antibodies and T cells against the bacterium cross-react with the person's own tissue"
          correct: true
          feedback: "Antibodies and T cells made against parts of the bacterium also recognise similar molecules in the heart. This is molecular mimicry: the bacteria are gone, and the host does the damage."
        - text: "Bacteria left behind in the heart are still multiplying"
          correct: false
          feedback: "The infection has cleared. The damage comes from the immune response: antibodies and T cells against the bacterium cross-react with heart tissue."
        - text: "Toxin stored in the heart is slowly released"
          correct: false
          feedback: "Toxins act during infection. Weeks later, the damage comes from antibodies and T cells that cross-react with the person's own tissue."
    entry: "Inflammation of the throat from infection (pharyngitis) or spreading infection of the skin (cellulitis); toxin-mediated illness; and, weeks later, post-infectious immune disease such as rheumatic fever. The last is a damage-response lesson: the host causes the damage."
  - slot: contrast
    entry: "*S. pneumoniae*: also a streptococcus, but alpha-haemolytic, in lancet-shaped pairs, defended mainly by its capsule rather than by enzymes and toxins."
