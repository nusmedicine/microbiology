id: route-n-meningitidis
title: "Route through the body: *Neisseria meningitidis*"
intro: "From the nasopharynx of a carrier to a close contact's blood, skin and meninges. At two steps, predict the site before the answer appears."

routes:
  - name: "From carriage to the blood and meninges"
    steps:
      - at: nose-throat
        kind: lives
        text: "Lives on the mucosa of the nasopharynx of a healthy carrier, attached by pili. It dies quickly outside the body, so it passes only to close contacts, in respiratory particles and secretions."
      - at: nose-throat
        kind: enters
        text: "In a close contact who has no antibodies against the strain, the bacteria attach to the nasopharyngeal mucosa and pass through the epithelial cells towards the small blood vessels beneath."
      - at: blood
        kind: multiplies
        via: blood
        ask: "The bacteria have crossed the mucosa of the nasopharynx. Where do they multiply next?"
        options: [blood, alveoli, gut]
        answer: [blood]
        why: "Small blood vessels lie just beneath the mucosa. The capsule protects the bacteria from phagocytes and complement in the blood, so they multiply there, and the blood carries them to every organ."
        text: "Protected by the capsule from phagocytes and complement, the bacteria multiply rapidly in the blood and shed endotoxin from their outer membrane."
      - at: spleen
        kind: defence
        text: "The spleen removes bacteria that antibodies and complement have coated; in asplenia, infection is more likely to become overwhelming. People who lack one of the late components of complement, which assemble pores that lyse the bacteria, are more likely to be infected, sometimes repeatedly."
      - at: skin
        kind: damages
        via: blood
        arrow: false
        ask: "Endotoxin makes small vessels leak and sets off clotting inside them, which uses up platelets and clotting factors. Where can this damage be seen from outside the body?"
        options: [skin, liver, bone]
        answer: [skin]
        why: "Blood escaping from damaged small vessels into the skin shows as purpura, purple spots that do not fade when pressed, because the blood lies outside the vessels. The same damage throughout the body makes vessels leak, and the blood pressure falls into shock."
        text: "Bleeding into the skin gives purpura, a rash of purple spots that do not fade when pressed. Leaking vessels throughout the body lower the blood pressure into shock, and clots can cut off the blood supply to fingers, toes and limbs."
      - at: brain
        kind: damages
        via: blood
        arrow: false
        text: "Bacteria also cross from the blood into the meninges and multiply in the cerebrospinal fluid, causing meningitis: fever, headache, neck stiffness and confusion."
