id: bacteria-map
title: "Check your understanding: a map of the bacteria"
questions:
  - id: m1
    stem: "Why are the anaerobes grouped together, even though they include Gram-positive and Gram-negative bacteria?"
    options:
      - text: "They share one decisive trait: oxygen poisons them"
        correct: true
        feedback: "'Anaerobe' is a one-trait group. That single trait predicts where they live, where they cause harm and how samples must be handled."
      - text: "They are all closely related in the family tree"
        correct: false
        feedback: "They are not; the group mixes Gram-negative rods such as *Bacteroides* with Gram-positive *Clostridium*. What unites them is their relationship with oxygen."
      - text: "They all form spores"
        correct: false
        feedback: "Only some, such as *Clostridium*, form spores. The shared trait is that oxygen poisons them."
  - id: m2
    stem: "*Haemophilus* grows on chocolate agar (agar made with lysed red cells) but not on ordinary agar. What is the best explanation?"
    options:
      - text: "It has lost genes for making factors that red cells contain, so they must be supplied"
        correct: true
        feedback: "Fastidious bacteria depend on nutrients they no longer make. Bursting the red cells releases the factors it needs."
      - text: "It needs the extra oxygen carried by red cells"
        correct: false
        feedback: "Oxygen is not the issue. It needs nutrient factors from inside red cells, which it can no longer make itself."
      - text: "Ordinary agar contains a chemical that kills it"
        correct: false
        feedback: "The problem is something missing, not something harmful: factors from red cells that it cannot make itself."
  - id: m3
    stem: "Why can *Neisseria* species only spread by close contact between people?"
    options:
      - text: "They are fragile and die quickly outside the human body"
        correct: true
        feedback: "An organism that dries out and dies within hours outside a host cannot spread through water, soil or surfaces; it passes by close contact."
      - text: "They are obligate anaerobes"
        correct: false
        feedback: "*Neisseria* use oxygen. Their limitation is fragility outside the body, which restricts spread to close contact."
      - text: "They form spores that only germinate in humans"
        correct: false
        feedback: "*Neisseria* form no spores; spores would make them hardy, not fragile. They die quickly outside the body."
  - id: m4
    stem: "*Mycoplasma* and *Chlamydia* both fail to show on a Gram stain. Which statement is correct?"
    options:
      - text: "*Mycoplasma* has no wall; *Chlamydia* is tiny, has almost no peptidoglycan, and hides inside cells"
        correct: true
        feedback: "Same failure, different causes, and the cause predicts the rest: *Mycoplasma* can grow without cells if given sterols; *Chlamydia* cannot."
      - text: "Both have no wall at all"
        correct: false
        feedback: "Only *Mycoplasma* has no wall. *Chlamydia* has a Gram-negative-type envelope with very little peptidoglycan, and lives inside cells."
      - text: "Both are too large to stain"
        correct: false
        feedback: "Both are very small. *Mycoplasma* has no wall; *Chlamydia* hides inside cells and has almost no peptidoglycan."
  - id: m5
    stem: "A drug works by blocking the building of the bacterial cell wall. Against which organism can it never work?"
    options:
      - text: "*Mycoplasma pneumoniae*"
        correct: true
        feedback: "There is no wall to build. 'What does it have that my cells lack?' Here, not a wall."
      - text: "*Staphylococcus aureus*"
        correct: false
        feedback: "*S. aureus* has a thick peptidoglycan wall, so wall-building is a possible target. *Mycoplasma* has no wall at all."
      - text: "*Escherichia coli*"
        correct: false
        feedback: "*E. coli* has a peptidoglycan wall, thin but present. *Mycoplasma* has none."
  - id: m6
    stem: "*Pseudomonas* cannot ferment and must respire. Which home suits it best?"
    options:
      - text: "Wet surfaces exposed to air, such as sinks"
        correct: true
        feedback: "Water plus oxygen suits a strict respirer. Metabolism predicts habitat."
      - text: "The oxygen-free colon"
        correct: false
        feedback: "Without fermentation it struggles where there is no oxygen. Wet, air-exposed surfaces suit it."
      - text: "Inside host cells only"
        correct: false
        feedback: "*Pseudomonas* lives freely in the environment. Water and air together suit an organism that must respire."
  - id: m7
    stem: "A urine sample from a woman with a bladder infection grows colonies overnight on ordinary agar incubated in air. The Gram stain shows straight Gram-negative rods. The organism ferments sugars, also grows without oxygen, and is oxidase negative. To which group on the map does it most likely belong?"
    options:
      - text: "Enterobacterales"
        correct: true
        feedback: "Every clue fits: Gram-negative rods that ferment sugars, grow with or without oxygen and grow overnight on ordinary media. The oxidase-negative result matches *E. coli*, the group member that lives in the gut and causes bladder infection."
      - text: "Pseudomonads, vibrios and Burkholderia"
        correct: false
        feedback: "*Pseudomonas* and *Burkholderia* cannot ferment and must respire, and *Pseudomonas* is oxidase positive; *Vibrio* is a curved rod. A straight rod that ferments and grows without oxygen points to the gut group."
      - text: "Anaerobes"
        correct: false
        feedback: "Oxygen poisons anaerobes, so they would not grow on a plate incubated in air. This organism grows with or without oxygen."
      - text: "Fastidious Gram-negatives"
        correct: false
        feedback: "Fastidious bacteria need enriched media because they have lost genes for making some nutrients. This organism grew overnight on ordinary agar."
  - id: m8
    stem: "Sputum from a patient who has coughed for several weeks shows almost nothing on a Gram stain. A stain in which the cells keep a red dye after washing with acid-alcohol shows thin rods, and colonies appear on culture only after several weeks. To which group on the map does the organism belong?"
    options:
      - text: "Mycobacteria"
        correct: true
        feedback: "The acid-fast result reads a waxy, mycolic-acid wall that resists the Gram stain, and colonies after weeks reflect division about once a day. Both traits together define the mycobacteria."
      - text: "Atypicals"
        correct: false
        feedback: "Atypicals also escape the Gram stain, but because they have no wall or live inside cells. A positive acid-fast stain shows a waxy wall, and *Chlamydia* and *Rickettsia* would not grow on culture at all."
      - text: "Spiral bacteria"
        correct: false
        feedback: "Spirochaetes are too thin to see on a Gram stain, but they are corkscrews, not straight rods, and the acid-fast stain reads a waxy wall that they lack."
      - text: "Gram-positive rods"
        correct: false
        feedback: "Gram-positive rods stain purple on a Gram stain and grow overnight on ordinary media. Here the Gram stain shows almost nothing and growth takes weeks."
