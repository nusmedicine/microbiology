id: bacteria-build-energy
title: "Check your understanding: how bacteria are built and get energy"
questions:
  - id: q1
    stem: "A technician leaves the alcohol on a Gram stain far too long. A Gram-positive organism on the slide will probably look:"
    options:
      - text: "Pink, and could be mistaken for Gram-negative"
        correct: true
        feedback: "Given long enough, even a thick wall lets the dye–iodine complex out. The cell then takes up the pink counterstain. The colour depends on the wall holding the complex during a short decolourising step."
      - text: "Purple, as usual, because the wall is thick"
        correct: false
        feedback: "A thick wall slows the loss of dye; it does not stop it. Over-decolourising washes the complex out, and the cell turns pink."
      - text: "Colourless, because alcohol destroys the cell"
        correct: false
        feedback: "The cell survives on the slide. It loses the purple complex and then picks up the pink counterstain."
  - id: q2
    stem: "Why does the Gram-negative outer membrane matter beyond the colour of a stain?"
    options:
      - text: "Its lipopolysaccharide (LPS) triggers strong inflammation in the host"
        correct: true
        feedback: "Lipid A, part of LPS, is recognised by immune receptors and drives fever and inflammation. That is why LPS is called endotoxin."
      - text: "It is the thick layer that keeps the purple dye in"
        correct: false
        feedback: "That is the Gram-positive peptidoglycan wall. The Gram-negative outer membrane is lipid, and its LPS is a powerful trigger of inflammation."
      - text: "It is where the cell stores its spare energy"
        correct: false
        feedback: "The outer membrane is a barrier, and its LPS is a major trigger of host inflammation. Energy storage is not its job."
  - id: q3
    stem: "In an oxygen-gradient tube, an organism grows only in a thin band just below the surface. What does this tell you about it?"
    options:
      - text: "It needs some oxygen, but full air levels harm it"
        correct: true
        feedback: "That is a microaerophile: it uses oxygen for respiration but is damaged at normal air levels, so it lives where oxygen is low but present."
      - text: "It cannot use oxygen at all"
        correct: false
        feedback: "An organism that cannot use oxygen and is harmed by it grows at the bottom. A band near the top means it needs a little oxygen, but not much."
      - text: "It grows best with as much oxygen as possible"
        correct: false
        feedback: "Then it would crowd the very top. Sitting just below the surface means full air is too much for it."
  - id: q4
    stem: "A friend says obligate anaerobes die in air because they have no catalase or superoxide dismutase. What is the better explanation?"
    options:
      - text: "Oxygen directly inactivates key enzymes they depend on; many anaerobes have those defence enzymes"
        correct: true
        feedback: "Many anaerobes, including *Bacteroides fragilis*, make catalase and superoxide dismutase. Their weak point is central enzymes built around iron–sulfur clusters or radical chemistry, which oxygen breaks."
      - text: "Your friend is right; that is the whole explanation"
        correct: false
        feedback: "That explanation came from an early observation that was over-read. Many anaerobes do carry these enzymes. Oxygen damages the metabolic enzymes they depend on."
      - text: "Oxygen dissolves their cell membrane"
        correct: false
        feedback: "Membranes are not dissolved by oxygen. The damage is to central enzymes, built around iron–sulfur clusters or radical chemistry, that oxygen inactivates."
  - id: q5
    stem: "*E. coli* grows faster near the top of an oxygen-gradient tube than at the bottom. Why?"
    options:
      - text: "Respiration with oxygen yields far more ATP per glucose than fermentation"
        correct: true
        feedback: "A facultative anaerobe can grow either way, but more ATP means faster growth where oxygen is available."
      - text: "Oxygen is toxic at the bottom of the tube"
        correct: false
        feedback: "There is no oxygen at the bottom. *E. coli* grows there by fermentation, just more slowly, because fermentation yields less ATP."
      - text: "It is an obligate aerobe"
        correct: false
        feedback: "An obligate aerobe would not grow at the bottom at all. *E. coli* grows throughout, best near the top: it is facultative."
  - id: q6
    stem: "Staphylococci form clusters and streptococci form chains. What does the arrangement reflect?"
    options:
      - text: "How the cells divide: in several planes, or in one"
        correct: true
        feedback: "Division in several planes piles cells into clusters; division in one plane lines them up in chains."
      - text: "Whether the wall is thick or thin"
        correct: false
        feedback: "Both have thick Gram-positive walls. The arrangement records the plane of cell division."
      - text: "Whether the organism uses oxygen"
        correct: false
        feedback: "Oxygen use does differ between them, but it is not visible as arrangement. Clusters and chains reflect how the cells divide."
  - id: q7
    stem: "Why can bacterial spores survive an alcohol hand rub that kills growing bacteria?"
    options:
      - text: "The spore's dehydrated core and tough coats resist alcohol"
        correct: true
        feedback: "A spore is a dormant, dehydrated cell inside protective coats. Alcohol does not get through. Soap and water work by physically removing spores."
      - text: "Spores are made only by Gram-negative bacteria, whose outer membrane blocks alcohol"
        correct: false
        feedback: "Spores are made by some Gram-positive rods, such as *Bacillus* and *Clostridium*. Their resistance comes from the spore's dehydrated core and coats."
      - text: "Spores can respire without oxygen"
        correct: false
        feedback: "Spores are dormant; they barely metabolise at all. Their resistance comes from their dehydrated core and protective coats."
  - id: q8
    stem: "Sputum from a man with a cough lasting three months is sent to the laboratory. A Gram stain shows almost no bacteria, but an acid-fast stain of the same sample shows many thin red rods. Culture takes three weeks to produce colonies. Which detail best explains why the Gram stain showed so little?"
    options:
      - text: "A wall packed with waxy mycolic acids"
        correct: true
        feedback: "Gram's dyes barely penetrate a waxy wall, so the organism is missed. The same wax holds the red dye against acid-alcohol, which is why the acid-fast stain shows it clearly."
      - text: "Slow growth, taking weeks to form colonies"
        correct: false
        feedback: "Growth rate decides how long culture takes, not what a stain shows. The organisms are already present in the sputum; their waxy wall keeps the Gram dyes out."
      - text: "No cell wall at all"
        correct: false
        feedback: "A wall-less bacterium would also be missed by the Gram stain, but it would not stay red after acid-alcohol. Holding the red dye requires a waxy wall of mycolic acids."
      - text: "A need for oxygen to make ATP"
        correct: false
        feedback: "Oxygen use decides where an organism grows, and has no bearing on how its envelope takes up dye. The waxy wall explains both staining results."
  - id: q9
    stem: "Pus from a skin abscess that followed a cut is Gram-stained and shows purple cocci in grape-like clusters. The organism grows overnight on a plate in room air. Of these organisms, which is the most likely cause?"
    options:
      - text: "*Staphylococcus aureus*"
        correct: true
        feedback: "Purple means a thick Gram-positive wall, and clusters mean division in several planes: staphylococci. Growth in air fits a facultative anaerobe, and a break in the skin is how it usually reaches tissue."
      - text: "*Streptococcus pyogenes*"
        correct: false
        feedback: "Streptococci are also purple cocci, but they divide in one plane and form chains. Grape-like clusters point to staphylococci."
      - text: "*Escherichia coli*"
        correct: false
        feedback: "*E. coli* is a Gram-negative rod, so it would appear as pink rods. The purple cocci rule it out."
      - text: "*Bacteroides fragilis*"
        correct: false
        feedback: "*B. fragilis* is a pink rod and an obligate anaerobe, so it would not grow on a plate in room air. Both the stain and the growth in air rule it out."
