id: host-microbe
title: "Check your understanding: microbes and their hosts"
questions:
  - id: h1
    stem: "A healthy nurse has *Staphylococcus aureus* growing in her nose but no symptoms. Which term fits best?"
    options:
      - text: "Carriage: the organism is present and transmissible without causing disease"
        correct: true
        feedback: "About a fifth of healthy people carry *S. aureus* in the nose persistently, and can pass it on by hand."
      - text: "Contamination, because the bacteria are only on a surface"
        correct: false
        feedback: "Contamination means present but not multiplying. Bacteria multiplying in the nose, and able to spread, indicate carriage."
      - text: "Disease, because the organism is detectable"
        correct: false
        feedback: "Disease requires damage with signs or symptoms. Detecting an organism in a well person indicates carriage."
  - id: h2
    stem: "Why can a course of antibacterial treatment be followed by overgrowth of the yeast *Candida albicans*?"
    options:
      - text: "The drug reduces the resident bacteria, which normally occupy sites and consume nutrients the yeast would need, and it does not act on fungi"
        correct: true
        feedback: "This is the loss of colonisation resistance. The drug removes the competitors and spares the yeast, which multiplies in their place."
      - text: "Antibacterial drugs make *C. albicans* more virulent"
        correct: false
        feedback: "The yeast does not change. What changes is the competition it faces once the resident bacteria are reduced."
      - text: "The drug damages the lining, letting the yeast invade"
        correct: false
        feedback: "The mechanism is ecological rather than structural: the loss of competing bacteria lets the yeast multiply."
  - id: h3
    stem: "In toxic shock syndrome, most of the damage comes from:"
    options:
      - text: "The host response, driven by a superantigen that activates many T cells at once"
        correct: true
        feedback: "A clear case of the right-hand side of the damage-response curve: a strong response causes the harm."
      - text: "Bacteria multiplying throughout the bloodstream"
        correct: false
        feedback: "The bacteria can be few and local. The toxin provokes a massive T-cell response, and that response does the damage."
      - text: "Bacteria directly destroying the cells of the heart and kidneys"
        correct: false
        feedback: "The damage is widespread and fast, and it follows from cytokines released by activated T cells, not from bacteria destroying cells where they grow."
  - id: h5
    stem: "Why does influenza virus infect airway cells rather than skin?"
    options:
      - text: "It can only attach where its receptor is present, which determines its tropism"
        correct: true
        feedback: "Attachment is the first step, and the distribution of the receptor sets the sites an organism can occupy."
      - text: "Skin is too cold for any virus"
        correct: false
        feedback: "Temperature matters for some organisms, but the main reason here is attachment: the receptor it binds is on airway cells."
      - text: "Skin cells have no nucleus for the virus to use"
        correct: false
        feedback: "Skin cells are nucleated. The limiting step is attachment to a specific receptor found on airway cells."
  - id: h6
    stem: "Two gardeners work the same wet soil and only one develops melioidosis. He has poorly controlled diabetes. What does this illustrate?"
    options:
      - text: "Host factors determine who becomes ill after the same exposure"
        correct: true
        feedback: "In Singapore, more than half of patients with melioidosis had diabetes, about three times the proportion in the general population of similar age."
      - text: "He must have met a more virulent strain"
        correct: false
        feedback: "Strains vary, but the shared exposure and the known effect of diabetes on neutrophil function point to a host factor."
      - text: "Melioidosis spreads from person to person"
        correct: false
        feedback: "Spread between people is very rare. The reservoir is soil and surface water, and host factors decide the outcome."
  - id: h7
    stem: "A microbe needs iron, but the host keeps iron bound to proteins such as transferrin. What is this an example of?"
    options:
      - text: "Nutritional immunity: the host withholds a nutrient the microbe needs"
        correct: true
        feedback: "Pathogens counter it with siderophores and receptors that strip iron from host proteins."
      - text: "A toxin produced by the host"
        correct: false
        feedback: "No toxin is involved. The host restricts access to iron, and pathogens evolve ways to take it back."
      - text: "Colonisation resistance"
        correct: false
        feedback: "Colonisation resistance is competition from resident microbes. Withholding iron is a host defence."
  - id: h8
    stem: "A 60-year-old woman receiving chemotherapy for leukaemia has a neutrophil count close to zero. A week later she develops a fever, and the yeast *Candida albicans* grows from her blood. Which detail best explains why this organism caused disease in her?"
    options:
      - text: "Her neutropenia"
        correct: true
        feedback: "*C. albicans* lives harmlessly on most people. Neutrophils normally contain it; without them it multiplies and invades. The host factor is the enabling condition."
      - text: "Her fever"
        correct: false
        feedback: "Fever is a consequence of the infection and accompanies almost any infection, so it cannot explain why this organism caused disease."
      - text: "Her age"
        correct: false
        feedback: "Age shifts risk a little, but most 60-year-olds carry *C. albicans* without harm. The absence of neutrophils is what allowed it to invade."
      - text: "A toxin made by the yeast"
        correct: false
        feedback: "The damage here comes from unchecked growth of an opportunist, not from a toxin. The deciding factor is the host's missing neutrophils."
  - id: h9
    stem: "A 55-year-old rice farmer with poorly controlled diabetes develops pneumonia during the rainy season. Of these organisms, which is the most likely cause?"
    options:
      - text: "*Burkholderia pseudomallei*"
        correct: true
        feedback: "Two enabling conditions point to it: exposure to wet soil and surface water, its reservoir, and diabetes, the host factor most strongly linked to melioidosis."
      - text: "*Candida albicans*"
        correct: false
        feedback: "*C. albicans* causes invasive disease mainly when neutrophils are absent or a barrier is breached. Nothing here suggests either, and the soil exposure points elsewhere."
      - text: "Influenza virus"
        correct: false
        feedback: "Influenza can cause pneumonia, but nothing in the history points to it in particular. The soil exposure and diabetes are the discriminating details."
      - text: "*Plasmodium falciparum*"
        correct: false
        feedback: "*P. falciparum* is carried by mosquitoes and infects red blood cells; it does not cause pneumonia after soil exposure."
