id: transmission-outbreaks
title: "Flashcards: transmission, outbreaks and One Health"
intro: "Most of these ask you to reason from a definition to a consequence."

cards:
  - id: tr1
    kind: how
    front: "Name the six links in the chain of infection."
    back: "Infectious agent, reservoir, portal of exit, mode of transmission, portal of entry, susceptible host. Each is a point where the chain can be broken."
  - id: tr2
    kind: why
    front: "Why can some infections be eradicated and others not?"
    back: "Eradication requires a human-only reservoir. An organism that also lives in animals, soil or water persists regardless of what happens in people."
  - id: tr3
    kind: apart
    front: "R₀ versus R?"
    back: "R₀: cases generated by one case in a fully susceptible population. R: cases generated now, given immunity and control measures. R > 1 means growth, R < 1 means decline."
  - id: tr4
    kind: how
    front: "What is the herd immunity threshold, and how is it calculated?"
    back: "The fraction immune at which R falls below 1: 1 − 1/R₀. For R₀ = 4 that is 75%; for an R₀ of 12 it is above 90%."
  - id: tr5
    kind: why
    front: "Why does reducing transmission lower *and* delay the epidemic peak?"
    back: "Each case passes on to fewer others, so the outbreak grows more slowly and never reaches as many people at once."
  - id: tr6
    kind: why
    front: "Why is pre-symptomatic transmission so hard to control?"
    back: "People transmit while they still feel well, so isolating only the visibly ill misses much of the spread."
  - id: tr7
    kind: apart
    front: "What do the two basic epidemic curve shapes mean?"
    back: "Cases within one incubation period: a single shared exposure (point source). Cases in successive waves: spread from person to person."
  - id: tr8
    kind: how
    front: "What are the steps of an outbreak investigation?"
    back: "Confirm cases and define a case; describe by person, place and time; form a hypothesis; compare exposures between affected and unaffected people; act to interrupt transmission."
  - id: tr9
    kind: why
    front: "What do Snow's pump handle and Semmelweis's hand washing have in common?"
    back: "Both interrupted a route before the agent was known. Knowing how something travels is enough to stop it."
  - id: tr10
    kind: how
    front: "What does One Health mean in practice?"
    back: "Human, animal and environmental health are linked: most emerging infections are zoonotic, antimicrobial use in animals selects resistance that reaches people, and land use and climate shift where vectors live."
