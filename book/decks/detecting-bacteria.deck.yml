id: detecting-bacteria
title: "Flashcards: detecting bacteria"
intro: "Each card asks for a mechanism or a distinction. Say the answer before checking it."

cards:
  - id: dc3
    kind: why
    front: "Why is culture still worth the wait?"
    back: "It produces a living isolate for susceptibility testing, identification and strain comparison, and it can grow organisms nobody specifically looked for."
  - id: dc4
    kind: apart
    front: "Selective versus differential medium?"
    back: "Selective: suppresses unwanted organisms so a target can be isolated. Differential: makes colonies look different according to a metabolic property, such as haemolysis on blood agar."
  - id: dc5
    kind: how
    front: "Define the MIC."
    back: "The minimum inhibitory concentration: the lowest drug concentration that prevents visible growth. A breakpoint converts it into susceptible or resistant."
  - id: dc6
    kind: why
    front: "Why does a 'susceptible' report not guarantee that a patient will respond?"
    back: "The test describes the organism in a tube. The drug must also reach the site at an adequate concentration, and host factors and the source of infection matter."
